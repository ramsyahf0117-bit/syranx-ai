<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Syranx AI - Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden; /* Mencegah layar geser ke samping */
    background-color: #09090b;
    color: #f4f4f5;
    font-family: 'Inter', sans-serif;
    height: 100dvh; /* dvh lebih akurat di HP */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Efek Lampu Latar (Glow) - Dikunci biar ga bikin layar geser */
  body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.2) 0%, rgba(9, 9, 11, 0) 70%);
    z-index: -1;
    pointer-events: none;
  }

  .container {
    padding: 20px;
    width: 100%;
    max-width: 400px; /* Biar pas di tengah */
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.8s ease-out;
    z-index: 10;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 24px;
    margin-bottom: 24px;
    box-shadow: 0 10px 30px rgba(124, 92, 255, 0.15);
  }

  .icon-wrapper svg {
    width: 40px;
    height: 40px;
    color: #7c5cff;
    animation: spin 4s linear infinite;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff, #7c5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }

  p {
    font-size: 14px;
    color: #a1a1aa;
    line-height: 1.6;
    margin-bottom: 30px;
    max-width: 90%;
  }

  /* Kotak Info / Status */
  .status-box {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #4dd4ff;
    width: 100%;
    max-width: 320px;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #4dd4ff;
    border-radius: 50%;
    animation: blink 1.5s infinite;
    flex-shrink: 0;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Tombol Ikon ! di Kanan */
  .info-btn {
    background: rgba(124, 92, 255, 0.15);
    border: 1px solid #7c5cff;
    color: #7c5cff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-left: auto; /* Dorong ke paling kanan */
    transition: 0.2s;
    animation: warningPulse 2s infinite;
    flex-shrink: 0;
  }

  .info-btn:active { transform: scale(0.9); }

  @keyframes warningPulse {
    0%, 100% { box-shadow: 0 0 0px rgba(124, 92, 255, 0); }
    50% { box-shadow: 0 0 10px rgba(124, 92, 255, 0.8); }
  }

  .footer {
    margin-top: 40px;
    font-size: 10px;
    color: #52525b;
    letter-spacing: 1px;
  }

  /* --- STYLE POP-UP PESAN (KERTAS) --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-content {
    background: #18181b;
    border: 1px solid #7c5cff;
    border-radius: 20px;
    padding: 30px 20px;
    width: 100%;
    max-width: 350px;
    box-shadow: 0 20px 50px rgba(124, 92, 255, 0.2);
    transform: scale(0.9);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    text-align: center;
    position: relative;
  }

  @keyframes popIn { to { transform: scale(1); } }

  .modal-content h2 {
    color: #7c5cff;
    font-size: 20px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .modal-content p {
    color: #f4f4f5;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
    max-width: 100%;
  }

  .modal-content strong {
    display: block;
    margin-top: 10px;
    color: #4dd4ff;
    font-size: 16px;
    letter-spacing: 1px;
  }

  .modal-close-btn {
    background: #7c5cff;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    transition: 0.2s;
  }
  .modal-close-btn:active { transform: scale(0.95); }

</style>
</head>
<body>

  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>

    <h1>SYRANX SEDANG MAINTENANCE</h1>
    <p>Kami sedang melakukan pembaruan sistem dan perbaikan server. Silakan kembali lagi nanti.</p>

    <div class="status-box">
      <span class="dot"></span>
      <span>MENGERJAKAN UPDATE...</span>
      <div class="info-btn" onclick="bukaPesan()">!</div>
    </div>

    <div class="footer">
      &copy; 2026 SYRANX AI • BY RAMSYAH
    </div>
  </div>

  <div class="modal-overlay" id="pesanModal">
    <div class="modal-content">
      <h2>UPDATE SYRANX !!</h2>
      <p>sorry we kalo di tutup, lagi update bre, tunggu ya mau fokus update besar-besaran</p>
      <strong>- salam DEVELOPER RAMX -</strong>
      <br>
      <button class="modal-close-btn" onclick="tutupPesan()">Tutup</button>
    </div>
  </div>

  <script>
    function bukaPesan() {
      document.getElementById('pesanModal').classList.add('show');
    }
    function tutupPesan() {
      document.getElementById('pesanModal').classList.remove('show');
    }
  </script>

</body>
</html>
